[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limbo33"
version = "1.0.0"
description = "A Python-first, zero-dependency local full-stack framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Limbo contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP :: WSGI :: Application"]
dependencies = []

[project.scripts]
limbo = "limbo.cli:main"

[tool.setuptools.packages.find]
include = ["limbo*"]

[tool.setuptools.package-data]
limbo = ["*.cjs"]

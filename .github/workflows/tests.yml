name: Tests

on:
  push:
    branches: ["main", "engineering/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify core imports without optional tools
        run: python -c "import limbo; print(limbo.__version__)"
      - name: Compile Python sources
        run: python -m compileall -q limbo tests
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

  platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify imports and compile
        run: |
          python -c "import limbo; print(limbo.__version__)"
          python -m compileall -q limbo tests
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
